name: Research validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install research dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-research.txt
      - name: Prepare pinned source and verified dataset
        run: .venv/bin/python scripts/setup_project.py
      - name: Prepare small ICBE source for failure-handling test
        run: .venv/bin/python scripts/setup_benchmarks.py --only ICBE
      - name: Prepare pinned FirmBench source for frozen case selection
        run: .venv/bin/python scripts/setup_benchmarks.py --only FirmBench
      - name: Validate notebook structure
        run: .venv/bin/python -c "import nbformat; from pathlib import Path; [nbformat.validate(nbformat.read(p, as_version=4)) for p in Path('notebooks').glob('*.ipynb')]"
      - name: Run research validity checks
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Verify frozen research design without API calls
        run: .venv/bin/python scripts/check_research_design.py
      - name: Verify aggregate-only public pilot package
        run: .venv/bin/python scripts/check_public_stage2.py
      - name: Verify aggregate-only native evaluation package
        run: .venv/bin/python scripts/check_public_stage3.py
      - name: Reproduce offline Kaggle validation matrix
        run: .venv/bin/python scripts/check_kaggle_matrix.py
      - name: Verify saved Kaggle readiness package
        run: .venv/bin/python scripts/check_public_stage4.py
      - name: Verify Stage 5 plan and saved primary evidence
        run: .venv/bin/python scripts/check_public_stage5.py
      - name: Verify Stage 6 preparation and pinned analysis sources
        run: .venv/bin/python scripts/check_stage6_readiness.py
      - name: Verify completed Stage 6 aggregate analysis
        run: .venv/bin/python scripts/check_public_stage6.py
      - name: Verify Stage 7 preparation and report source assets
        run: .venv/bin/python scripts/check_stage7_readiness.py
      - name: Verify completed Stage 7 report and reviewed PDF binding
        run: .venv/bin/python scripts/check_public_stage7.py
      - name: Verify Stage 8 reproduction and release preparation
        run: .venv/bin/python scripts/check_stage8_readiness.py
      - name: Execute the integration notebook without API calls
        run: .venv/bin/python scripts/verify_notebook.py
      - name: Execute the setup evidence notebook without API calls
        run: .venv/bin/python scripts/verify_notebook.py --notebook notebooks/02_benchmark_setup.ipynb
      - name: Execute the frozen design notebook without API calls
        run: .venv/bin/python scripts/verify_notebook.py --notebook notebooks/03_kaggle_llm_experiment.ipynb
      - name: Execute saved pilot-cost analysis without API calls
        run: .venv/bin/python scripts/verify_notebook.py --notebook notebooks/04_results_analysis.ipynb
      - name: Execute saved native evaluation analysis without API calls
        run: .venv/bin/python scripts/verify_notebook.py --notebook notebooks/05_native_evaluation.ipynb
      - name: Execute saved Kaggle readiness analysis without API calls
        run: .venv/bin/python scripts/verify_notebook.py --notebook notebooks/06_kaggle_experiment_readiness.ipynb
      - name: Execute saved primary shock comparisons without API calls
        run: .venv/bin/python scripts/verify_notebook.py --notebook notebooks/07_primary_shock_comparisons.ipynb
      - name: Execute final findings and robustness analysis without API calls
        run: .venv/bin/python scripts/verify_notebook.py --notebook notebooks/08_findings_and_robustness.ipynb
